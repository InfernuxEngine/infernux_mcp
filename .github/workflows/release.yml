name: Package and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Get the lightweight engine SDK source
        uses: actions/checkout@v4
        with:
          repository: ChenlizheMe/Infernux
          # Pin the standalone client contract, including before the paired engine PR merges.
          ref: 0945959a4b527a1cd8db496d86cc70fa13ec0661
          path: engine-sdk
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /python/pyproject.toml
            /python/infernux_automation/
      - name: Install service dependencies without native engine binaries
        run: python -m pip install ./engine-sdk/python -r package/requirements.txt
      - name: Exercise the standard MCP protocol and client configurations
        env:
          INFERNUX_NATIVE_MODULE_DIR: /unavailable-native
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Build plugin
        run: python package.py build dist/infernux.mcp.inxpkg
      - if: startsWith(github.ref, 'refs/tags/')
        run: python package.py release-manifest dist/infernux.mcp.inxpkg --tag "$GITHUB_REF_NAME" --output dist/infernux-plugin-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-package
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/infernux.mcp.inxpkg dist/infernux-plugin-release.json --generate-notes
