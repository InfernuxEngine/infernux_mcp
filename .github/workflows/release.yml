name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install client transport dependencies
        run: python -m pip install -r package/requirements.txt
      - name: Test standalone client and real HTTP workflows
        run: python -m unittest discover -s test -p 'test_client*.py' -v
      - name: Test Python launcher virtual environments
        run: python -m unittest discover -s test -p 'test_supervisor_paths.py' -v
      - name: Validate Python sources and reproducible package output
        run: |
          python -m compileall -q package/editor
          mkdir -p dist/repro
          python package.py build dist/infernux.mcp.inxpkg
          python package.py verify dist/infernux.mcp.inxpkg
          python package.py build dist/repro/infernux.mcp.inxpkg
          cmp dist/infernux.mcp.inxpkg dist/repro/infernux.mcp.inxpkg

  release:
    needs: validate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build release assets
        run: |
          python package.py build dist/infernux.mcp.inxpkg
          python package.py verify dist/infernux.mcp.inxpkg
          python package.py release-manifest dist/infernux.mcp.inxpkg \
            --tag "${GITHUB_REF_NAME}" --output dist/infernux-plugin-release.json
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/infernux.mcp.inxpkg dist/infernux-plugin-release.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/infernux.mcp.inxpkg dist/infernux-plugin-release.json \
              --verify-tag --generate-notes
          fi
